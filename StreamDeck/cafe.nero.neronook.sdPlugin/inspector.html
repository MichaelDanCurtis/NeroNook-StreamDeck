<!doctype html><html><head><meta charset="utf-8"><style>
body{font:13px system-ui;color:#ddd;background:#2d2d2d;margin:16px}label{display:block;margin:14px 0 5px}select,input,textarea,button{box-sizing:border-box;width:100%;padding:8px;border:1px solid #606060;border-radius:6px;background:#383838;color:#fff}p{line-height:1.5;color:#aaa}textarea{height:85px}button{cursor:pointer;margin-top:12px}
</style></head><body><b>NeroNook</b><p id="status">Connecting…</p><label for="target">Action or status</label><select id="target"><option value="">Waiting for NeroNook</option></select><div id="argumentsRow"><label for="args">Arguments (JSON)</label><textarea id="args" spellcheck="false">{}</textarea></div><div id="fieldRow" hidden><label for="field">Value to show</label><input id="field" value="message"></div><p id="schema"></p><button id="save">Save mapping</button><button id="test">Test mapping</button><button id="refresh">Refresh available actions</button><p>Grant access to other modules in NeroNook → Settings → Modules. Changes require review for each run. Elgato retains control of your hardware and profiles.</p>
<script>
let ws,context,action,settings={},catalog=[],pendingCatalog=[],catalogGeneration;
const el=id=>document.getElementById(id);
function send(event,payload){if(ws?.readyState===1)ws.send(JSON.stringify({event,context,action,payload}));}
function render(){const status=action?.endsWith('.status');el('argumentsRow').hidden=status;el('fieldRow').hidden=!status;const select=el('target');select.replaceChildren();for(const item of catalog.filter(x=>status?x.channel?.kind==='state':x.action)){const option=document.createElement('option');option.value=item.address.plugin+'/'+item.address.name;option.textContent=(item.action?.title||item.channel?.title)+' · '+item.address.plugin;select.append(option);}select.value=(settings.provider||'cafe.nero.plugin.streamdeck')+'/'+(settings.name||(status?'connection':'check_connection'));el('args').value=settings.arguments||'{}';el('field').value=settings.field||'message';describe();}
function describe(){const item=catalog.find(x=>x.address.plugin+'/'+x.address.name===el('target').value);el('schema').textContent=item?.action?'Inputs: '+(item.action.input.fields.map(x=>x.name+' ('+x.kind+(x.required?', required':'')+')').join(', ')||'none')+(item.action.effect!=='readOnly'?' · Each run requires review.':''):item?.channel?'Fields: '+item.channel.schema.fields.map(x=>x.name).join(', '):'No permitted target selected.';}
window.connectElgatoStreamDeckSocket=(port,uuid,registerEvent,info,actionInfo)=>{if(!/^\d+$/.test(String(port)))return;const data=JSON.parse(actionInfo);context=uuid;action=data.action;settings=data.payload?.settings||{};ws=new WebSocket('ws://127.0.0.1:'+port);ws.onopen=()=>{ws.send(JSON.stringify({event:registerEvent,uuid}));send('sendToPlugin',{refresh:true});};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.event==='sendToPropertyInspector'){const p=m.payload||{};if(catalogGeneration!==p.catalogGeneration){catalogGeneration=p.catalogGeneration;pendingCatalog=[];}pendingCatalog.push(...(p.catalog||[]));if(pendingCatalog.length>1280){pendingCatalog=[];return;}if(p.complete){catalog=pendingCatalog;pendingCatalog=[];el('status').textContent=p.online?'Connected to NeroNook':'Enable the Stream Deck module in NeroNook';render();}}};ws.onclose=()=>{el('status').textContent='Elgato connection closed';};render();};
el('test').onclick=()=>send('sendToPlugin',{test:true});el('target').onchange=describe;el('refresh').onclick=()=>send('sendToPlugin',{refresh:true});el('save').onclick=()=>{const selected=catalog.find(x=>x.address.plugin+'/'+x.address.name===el('target').value);if(!selected){el('status').textContent='Choose an available target.';return;}try{const args=JSON.parse(el('args').value);if(!args||typeof args!=='object'||Array.isArray(args))throw Error();settings={provider:selected.address.plugin,name:selected.address.name,arguments:JSON.stringify(args),field:el('field').value};send('setSettings',settings);el('status').textContent='Mapping saved';}catch{el('status').textContent='Arguments must be a JSON object.';}};
</script></body></html>
